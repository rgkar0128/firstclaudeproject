[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "healthcare-kg"
version = "0.1.0"
description = "Healthcare ontology knowledge graph — maps SNOMED CT, ICD-10, LOINC, and RxNorm into a unified Neo4j graph with Claude-powered NL querying"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.30.0",
    "neo4j>=5.0.0",
    "pandas>=2.0.0",
    "click>=8.0.0",
    "python-dotenv>=1.0.0",
    "lxml>=4.9.0",
    "tqdm>=4.60.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.0.0",
]

[project.scripts]
healthcare-kg = "healthcare_kg.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
